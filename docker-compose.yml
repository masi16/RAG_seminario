services:
  # FastAPI (Búsqueda Híbrida: BM25 + ChromaDB + SQLite)
  rag-api:
    build: .
    container_name: rag_unlar_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Sincroniza el código local con el contenedor
      - .:/app
      # Asegura que SQLite y ChromaDB se guarden en el disco físico
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

  # 2. Workflow n8n
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_unlar
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Argentina/La_Rioja
    depends_on:
      - rag-api
      - ollama

  # 3. Servidor de LLM local (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_llm
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # aceleración por GPU NVIDIA en WSL/Linux:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  n8n_data:
  ollama_models: